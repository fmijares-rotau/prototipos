<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VisualPresencia Cloud — Buscador de módulos</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<script>
  // ---------------------------------------------------------------------
  // Tailwind theme tokens — light mode, matched to the real
  // VisualPresencia Cloud UI (white surface, soft purple/lavender accent,
  // the same tone as the "RRHH" category panel in the app).
  // ---------------------------------------------------------------------
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas:        '#F4F5F8', // page/app backdrop behind the modal
          surface:       '#FFFFFF', // palette bar + dropdown
          surfaceRaised: '#F4F2FD', // hovered / selected row (lavender tint)
          edge:          '#E4E7EC', // hairline borders
          ink:           '#1F2430', // primary text
          mute:          '#6B7280', // secondary text
          faint:         '#9CA3AF', // tertiary / placeholders
          accent:        '#8B7FE8', // VisualPresencia purple — signature color
          accentDim:     '#8B7FE81f',
        },
        fontFamily: {
          label: ['Manrope', 'sans-serif'],
          body:  ['Inter', 'sans-serif'],
          mono:  ['JetBrains Mono', 'monospace'],
        },
        boxShadow: {
          bar:     '0 1px 2px rgba(16,24,40,0.04), 0 0 0 1px rgba(16,24,40,0.05)',
          dropdown:'0 12px 32px -8px rgba(16,24,40,0.18), 0 0 0 1px rgba(16,24,40,0.05)',
        },
      },
    },
  };
</script>

<style>
  html, body { background: #F4F5F8; }
  body { font-family: 'Inter', sans-serif; }

  .vp-scroll::-webkit-scrollbar { width: 8px; }
  .vp-scroll::-webkit-scrollbar-track { background: transparent; }
  .vp-scroll::-webkit-scrollbar-thumb { background: #E4E7EC; border-radius: 999px; }
  .vp-scroll::-webkit-scrollbar-thumb:hover { background: #D3D7E0; }

  .vp-focusable:focus-visible {
    outline: 2px solid #8B7FE8;
    outline-offset: 2px;
    border-radius: 8px;
  }

  .vp-transition { transition: all 200ms ease; }

  /* Signature element: a slim purple underline that grows from the search
     icon outward when the bar is focused — quiet, on-brand, one line. */
  .vp-focus-rule {
    position: absolute; left: 44px; right: 16px; bottom: 0; height: 2px;
    background: #8B7FE8;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 200ms ease;
  }
  .vp-focused .vp-focus-rule { transform: scaleX(1); }

  /* Live presence dot — small nod to the product's own name */
  @keyframes vp-pulse {
    0%, 100% { opacity: 0.45; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }
  .vp-pulse-dot { animation: vp-pulse 2.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .vp-pulse-dot { animation: none !important; }
  }

  mark.vp-match {
    background: transparent;
    color: #6C5CE7;
    font-weight: 700;
  }

  @keyframes vp-in {
    from { opacity: 0; transform: translateY(-4px) scale(0.99); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .vp-enter { animation: vp-in 160ms ease; }

  .kbd-key {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 1px 6px; border-radius: 5px;
    background: #F4F5F8; border: 1px solid #E4E7EC; color: #6B7280;
  }
</style>
</head>

<body class="min-h-screen bg-canvas text-ink font-body">

  <!-- ============================================================
       Demo shell: a loose recreation of the real modal (sidebar +
       purple category panel + module grid) so the search bar can be
       seen sitting exactly where it needs to live — in the empty
       strip above the grid, as ONE line.
  ============================================================ -->
  <div class="min-h-screen flex items-start justify-center p-6">

    <div class="w-full max-w-5xl mt-6 rounded-2xl bg-white shadow-dropdown overflow-hidden flex" style="min-height:560px;">

      <!-- Purple category panel (mock, matches screenshot) -->
      <div class="w-[180px] shrink-0 bg-accent flex flex-col items-center justify-center gap-3 text-white m-4 rounded-2xl">
        <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="10" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span class="font-label font-bold text-sm tracking-wide">RRHH</span>
      </div>

      <!-- Right side: search bar (single line) + module grid -->
      <div class="flex-1 flex flex-col min-w-0">

        <!-- ============================================================
             COMMAND PALETTE COMPONENT — single line, expands as a
             dropdown below when focused / typing.
        ============================================================ -->
        <div id="palette" class="relative px-5 pt-5 pb-3">

          <div id="paletteShell" class="relative rounded-xl bg-white border border-edge shadow-bar vp-transition">

            <!-- Single-line bar -->
            <div class="relative flex items-center gap-2.5 px-4" style="height:44px;">
              <svg class="w-4 h-4 text-faint shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>

              <input
                id="searchInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                class="flex-1 bg-transparent outline-none text-[14px] placeholder:text-faint text-ink"
                placeholder="Buscar módulo, acción o configuración…"
                aria-label="Buscar módulo, acción o configuración"
                role="combobox"
                aria-expanded="false"
                aria-controls="resultsList"
                aria-autocomplete="list"
              />

              <div class="flex items-center gap-2 shrink-0">
                <span class="w-1.5 h-1.5 rounded-full bg-accent vp-pulse-dot" aria-hidden="true"></span>
                <kbd id="shortcutHint" class="font-mono text-[10px] text-faint border border-edge rounded px-1.5 py-0.5">Ctrl+K</kbd>
              </div>

              <div class="vp-focus-rule"></div>
            </div>

            <!-- Dropdown: only visible while focused/typing, floats over the grid -->
            <div id="paletteDropdown" class="hidden absolute left-0 right-0 top-[48px] z-20 rounded-xl bg-white border border-edge shadow-dropdown vp-enter overflow-hidden">
              <div id="paletteBody" class="vp-scroll max-h-[380px] overflow-y-auto">

                <!-- INITIAL STATE -->
                <div id="initialState" class="px-3 py-3">
                  <section>
                    <h2 class="font-label text-[10px] tracking-widest uppercase text-faint px-2 mb-1.5">Recientes</h2>
                    <ul id="recentList" class="space-y-0.5"></ul>
                    <p id="recentEmpty" class="hidden text-sm text-faint px-2 py-2">Aún no tienes búsquedas recientes.</p>
                  </section>

                  <section class="mt-3">
                    <h2 class="font-label text-[10px] tracking-widest uppercase text-faint px-2 mb-1.5">Etiquetas populares</h2>
                    <div id="tagList" class="flex flex-wrap gap-1.5 px-2"></div>
                  </section>
                </div>

                <!-- RESULTS STATE -->
                <div id="resultsState" class="hidden px-3 py-3">
                  <ul id="resultsList" role="listbox" aria-label="Resultados de búsqueda" class="space-y-3"></ul>
                  <div id="noResults" class="hidden flex-col items-center justify-center text-center py-8 px-4">
                    <svg class="w-7 h-7 text-faint mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="7"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <p class="text-sm text-mute">Sin resultados para "<span id="noResultsQuery" class="text-ink"></span>"</p>
                    <p class="text-xs text-faint mt-1">Prueba con otro término o revisa la ortografía.</p>
                  </div>
                </div>
              </div>

          
            </div>
          </div>
        </div>

        <!-- Mock module grid, just so the bar has real context beneath it -->
        <div class="px-5 pb-5 grid grid-cols-4 gap-x-4 gap-y-3 overflow-y-auto">
          <div id="mockGrid" class="contents"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast (execution feedback) -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-lg bg-white border border-edge text-sm text-ink shadow-dropdown vp-transition"></div>

<script>
/* =====================================================================
   DATA — module names mirrored from the real VisualPresencia Cloud
   "RRHH" grid, plus a few extras for category variety.
===================================================================== */
const modules = [
  { id: 1,  title: "Documentos",                 category: "Documentos", icon: "folder",  keywords: ["documentos","archivos"] },
  { id: 2,  title: "Gestion onboarding",         category: "RRHH",       icon: "presence", keywords: ["onboarding","incorporacion","nuevo empleado"] },
  { id: 3,  title: "Nom-35",                      category: "Nómina",     icon: "coin",     keywords: ["nom35","riesgo psicosocial"] },
  { id: 4,  title: "Documentos P.R.L.",          category: "Documentos", icon: "document", keywords: ["prl","prevencion","riesgos laborales"] },
  { id: 5,  title: "Documentos compliance",      category: "Documentos", icon: "folder",   keywords: ["compliance","normativa"] },
  { id: 6,  title: "Bajas Excedencias",          category: "RRHH",       icon: "document", keywords: ["baja","excedencia","ausencia"] },
  { id: 7,  title: "Justificantes",              category: "RRHH",       icon: "document", keywords: ["justificante","ausencia"] },
  { id: 8,  title: "Nivel Gestión",              category: "Configuración", icon: "chart", keywords: ["nivel","gestion","jerarquia"] },
  { id: 9,  title: "Solicitudes",                category: "RRHH",       icon: "check",    keywords: ["solicitudes","peticiones"] },
  { id: 10, title: "Solicitudes Fichajes",       category: "RRHH",       icon: "clock",    keywords: ["fichaje","solicitud"] },
  { id: 11, title: "Solicitudes Jorn. Irr.",     category: "RRHH",       icon: "clock",    keywords: ["jornada irregular","solicitud"] },
  { id: 12, title: "Solicitudes Teletrabajo",    category: "RRHH",       icon: "presence", keywords: ["teletrabajo","remoto","solicitud"] },
  { id: 13, title: "Solicitudes Horas",          category: "RRHH",       icon: "clock",    keywords: ["horas","solicitud","hora"] },
  { id: 14, title: "Solicitudes Viajes",         category: "Viajes y Gastos", icon: "plane", keywords: ["viaje","desplazamiento","solicitud"] },
  { id: 15, title: "Solicitudes Fichaje Aut.",   category: "RRHH",       icon: "clock",    keywords: ["fichaje automatico","solicitud"] },
  { id: 16, title: "Carga Datos",                category: "Configuración", icon: "layers", keywords: ["carga","importar","datos"] },
  { id: 17, title: "Solicitudes Cambio Hor.",    category: "RRHH",       icon: "clock",    keywords: ["cambio horario","solicitud","hora"] },
  { id: 18, title: "Solicitudes Horas Extras",   category: "RRHH",       icon: "clock",    keywords: ["horas extras","extra","solicitud","hora"] },
  { id: 19, title: "Compara Calendarios",        category: "Configuración", icon: "calendar", keywords: ["calendario","comparar"] },
  { id: 20, title: "Mensajeria",                 category: "Configuración", icon: "document", keywords: ["mensajes","chat","avisos"] },
  { id: 21, title: "Préstamos",                  category: "Nómina",     icon: "coin",     keywords: ["prestamo","anticipo"] },
  { id: 22, title: "Solicitudes Hor. Recup.",    category: "RRHH",       icon: "clock",    keywords: ["horas recuperables","solicitud","hora"] },
  { id: 23, title: "Solicitudes Recup.",         category: "RRHH",       icon: "check",    keywords: ["recuperacion","solicitud"] },
  { id: 24, title: "Facturación",                category: "Nómina",     icon: "coin",     keywords: ["factura","facturacion","pago"] },
  { id: 25, title: "Usuarios",                   category: "Usuarios y Accesos", icon: "users", keywords: ["empleado","empleados","personal"] },
  { id: 26, title: "Vacaciones Permisos",        category: "Configuración", icon: "calendar", keywords: ["vacaciones","permisos","ausencias"] },
  { id: 27, title: "Departamentos",              category: "Usuarios y Accesos", icon: "layers", keywords: ["departamentos","areas"] },
  { id: 28, title: "Organigramas",               category: "Usuarios y Accesos", icon: "chart", keywords: ["organigrama","jerarquia"] },
];

const POPULAR_TAGS = ["Vacaciones","Horarios","Solicitudes","Usuarios","Fichajes","Documentos"];
const RECENTS_KEY = "vp_recent_modules";
const MAX_RECENTS = 8;

const ICONS = {
  calendar: '<rect x="3" y="4" width="18" height="17" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>',
  clock: '<circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="10" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
  layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline>',
  chart: '<line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>',
  document: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline>',
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  presence: '<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle>',
  coin: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9 9.5c0-1.1 1.3-2 3-2s3 .9 3 2-1.3 2-3 2-3 .9-3 2 1.3 2 3 2 3-.9 3-2"></path>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>',
  plane: '<path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path>',
};

function iconSvg(key, cls) {
  const inner = ICONS[key] || ICONS.document;
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* =====================================================================
   SEARCH (accent/case-insensitive, title + keyword matching, highlight)
===================================================================== */
function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function matchModule(mod, rawQuery) {
  const q = normalize(rawQuery.trim());
  if (!q) return { match: true, score: 0, highlightRange: null };
  const title = normalize(mod.title);
  const idx = title.indexOf(q);
  if (idx === 0) return { match: true, score: 3, highlightRange: [0, q.length] };
  if (idx > -1)   return { match: true, score: 2, highlightRange: [idx, idx + q.length] };
  const kwHit = mod.keywords.some(k => normalize(k).includes(q));
  if (kwHit) return { match: true, score: 1, highlightRange: null };
  return { match: false };
}

function highlightTitle(title, range) {
  if (!range) return escapeHtml(title);
  const [start, end] = range;
  return escapeHtml(title.slice(0, start)) +
    `<mark class="vp-match">${escapeHtml(title.slice(start, end))}</mark>` +
    escapeHtml(title.slice(end));
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function search(query) {
  return modules
    .map(mod => ({ mod, ...matchModule(mod, query) }))
    .filter(r => r.match)
    .sort((a, b) => b.score - a.score || a.mod.title.localeCompare(b.mod.title));
}

function groupByCategory(results) {
  const order = [];
  const groups = {};
  for (const r of results) {
    const cat = r.mod.category;
    if (!groups[cat]) { groups[cat] = []; order.push(cat); }
    groups[cat].push(r);
  }
  return order.map(cat => ({ category: cat, items: groups[cat] }));
}

/* Recents (localStorage) */
function getRecents() {
  try { return JSON.parse(localStorage.getItem(RECENTS_KEY)) || []; }
  catch { return []; }
}
function addRecent(mod) {
  let recents = getRecents().filter(r => r.id !== mod.id);
  recents.unshift({ id: mod.id, title: mod.title, category: mod.category, icon: mod.icon });
  recents = recents.slice(0, MAX_RECENTS);
  localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
}

/* =====================================================================
   RENDERING
===================================================================== */
const el = {
  input: document.getElementById("searchInput"),
  shell: document.getElementById("paletteShell"),
  dropdown: document.getElementById("paletteDropdown"),
  initialState: document.getElementById("initialState"),
  resultsState: document.getElementById("resultsState"),
  resultsList: document.getElementById("resultsList"),
  noResults: document.getElementById("noResults"),
  noResultsQuery: document.getElementById("noResultsQuery"),
  recentList: document.getElementById("recentList"),
  recentEmpty: document.getElementById("recentEmpty"),
  tagList: document.getElementById("tagList"),
  toast: document.getElementById("toast"),
};

let flatResults = [];
let selectedIndex = -1;

function renderRecents() {
  const recents = getRecents();
  el.recentList.innerHTML = "";
  el.recentEmpty.classList.toggle("hidden", recents.length > 0);
  recents.forEach(r => {
    const li = document.createElement("li");
    li.innerHTML = `
      <button class="vp-focusable w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg hover:bg-surfaceRaised vp-transition text-left" data-recent-id="${r.id}">
        ${iconSvg(r.icon, "w-4 h-4 text-accent shrink-0")}
        <span class="text-sm text-ink">${escapeHtml(r.title)}</span>
        <span class="ml-auto text-xs text-faint">${escapeHtml(r.category)}</span>
      </button>`;
    li.querySelector("button").addEventListener("click", () => {
      const mod = modules.find(m => m.id === r.id);
      if (mod) selectModule(mod);
    });
    el.recentList.appendChild(li);
  });
}

function renderTags() {
  el.tagList.innerHTML = "";
  POPULAR_TAGS.forEach(tag => {
    const btn = document.createElement("button");
    btn.className = "vp-focusable px-2.5 py-1 rounded-full bg-surfaceRaised border border-edge text-xs text-mute hover:text-accent hover:border-accent vp-transition";
    btn.textContent = "#" + tag;
    btn.addEventListener("click", () => {
      el.input.value = tag;
      el.input.focus();
      handleInput();
    });
    el.tagList.appendChild(btn);
  });
}

function renderResults(query) {
  const results = search(query);
  const grouped = groupByCategory(results);
  flatResults = results.map(r => r.mod);
  selectedIndex = flatResults.length ? 0 : -1;

  el.resultsList.innerHTML = "";
  el.noResults.classList.toggle("hidden", results.length > 0);
  el.noResults.classList.toggle("flex", results.length === 0);
  el.noResultsQuery.textContent = query;

  let runningIndex = 0;
  grouped.forEach(group => {
    const section = document.createElement("li");
    const itemsHtml = group.items.map(({ mod, highlightRange }) => {
      const i = runningIndex++;
      return `
        <li>
          <button class="vp-focusable vp-transition w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg text-left result-row"
            data-index="${i}" role="option" id="result-${i}">
            ${iconSvg(mod.icon, "w-4 h-4 text-accent shrink-0")}
            <span class="text-sm text-ink">${highlightTitle(mod.title, highlightRange)}</span>
            <span class="ml-auto text-xs text-faint">${escapeHtml(mod.category)}</span>
          </button>
        </li>`;
    }).join("");
    section.innerHTML = `
      <h3 class="font-label text-[10px] tracking-widest uppercase text-faint px-2 mb-1">${escapeHtml(group.category)}</h3>
      <ul class="space-y-0.5">${itemsHtml}</ul>`;
    el.resultsList.appendChild(section);
  });

  el.resultsList.querySelectorAll(".result-row").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.index);
      selectModule(flatResults[i]);
    });
  });
  paintSelection();
}

function paintSelection() {
  el.resultsList.querySelectorAll(".result-row").forEach((btn, i) => {
    const active = i === selectedIndex;
    btn.classList.toggle("bg-surfaceRaised", active);
    btn.setAttribute("aria-selected", active ? "true" : "false");
    if (active) btn.scrollIntoView({ block: "nearest" });
  });
}

function handleInput() {
  const query = el.input.value;
  const hasQuery = query.trim().length > 0;
  el.initialState.classList.toggle("hidden", hasQuery);
  el.resultsState.classList.toggle("hidden", !hasQuery);
  if (hasQuery) renderResults(query);
  openDropdown();
}

function selectModule(mod) {
  addRecent(mod);
  renderRecents();
  showToast(`Abriendo “${mod.title}”…`);
  el.input.value = "";
  handleInput();
  closeDropdown();
  el.input.blur();
}

function showToast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.remove("hidden");
  el.toast.style.opacity = "1";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    el.toast.style.opacity = "0";
    setTimeout(() => el.toast.classList.add("hidden"), 200);
  }, 1800);
}

/* Dropdown open/close — this is what keeps the bar to ONE line by default */
function openDropdown() {
  el.dropdown.classList.remove("hidden");
  el.input.setAttribute("aria-expanded", "true");
}
function closeDropdown() {
  el.dropdown.classList.add("hidden");
  el.input.setAttribute("aria-expanded", "false");
}

/* Keyboard navigation */
function moveSelection(delta) {
  if (!flatResults.length) return;
  selectedIndex = (selectedIndex + delta + flatResults.length) % flatResults.length;
  paintSelection();
}

el.input.addEventListener("input", handleInput);
el.input.addEventListener("focus", () => { el.shell.classList.add("vp-focused"); openDropdown(); });

document.addEventListener("click", (e) => {
  if (!el.shell.contains(e.target)) {
    el.shell.classList.remove("vp-focused");
    closeDropdown();
  }
});

el.input.addEventListener("keydown", (e) => {
  const hasQuery = el.input.value.trim().length > 0;
  if (e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey && hasQuery)) {
    e.preventDefault(); moveSelection(1);
  } else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey && hasQuery)) {
    e.preventDefault(); moveSelection(-1);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (hasQuery && selectedIndex > -1) selectModule(flatResults[selectedIndex]);
  } else if (e.key === "Escape") {
    e.preventDefault();
    if (hasQuery) { el.input.value = ""; handleInput(); }
    else { closeDropdown(); el.input.blur(); }
  }
});

document.addEventListener("keydown", (e) => {
  const cmd = e.ctrlKey || e.metaKey;
  if (cmd && e.key.toLowerCase() === "k") {
    e.preventDefault();
    el.input.focus();
  }
});

/* Mock grid, just to give the single-line bar visual context */
function renderMockGrid() {
  const grid = document.getElementById("mockGrid");
  grid.innerHTML = modules.map(mod => `
    <div class="flex items-center gap-2 py-1.5">
      <span class="w-7 h-7 rounded-md bg-surfaceRaised flex items-center justify-center text-accent shrink-0">
        ${iconSvg(mod.icon, "w-4 h-4")}
      </span>
      <span class="text-[13px] text-ink leading-tight">${escapeHtml(mod.title)}</span>
      <svg class="w-3.5 h-3.5 text-faint ml-auto shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
    </div>`).join("");
}

/* Init */
renderRecents();
renderTags();
renderMockGrid();
</script>
