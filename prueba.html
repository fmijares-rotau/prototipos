<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Fichajes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: {
                        'widescreen': '1600px', // Breakpoint personalizado para 1600px
                    },
                    colors: {
                        indigo: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }

        // Funciones placeholder para demostración
        function showConfirm(message, callback, ...args) {
            console.log(message);
            if(confirm(message.replace(/<br>/g, '\n'))) {
                callback(...args);
            }
        }
        
        function nuevoElemento() { console.log("Nuevo elemento"); }
        function importaElementos() { console.log("Importar elementos"); }
        function sinFichajes() { console.log("Sin fichajes"); }
        function borrarMultiple() { console.log("Borrar múltiple"); }
        function limpiarFiltros() { console.log("Limpiar filtros"); }
        function fechaBusqueda() { console.log("Buscar por fecha"); }
        function filtraElemento() { console.log("Filtrar elemento"); }
        function imprimir() { console.log("Imprimir/Exportar"); }
        
        function toggleMasFiltros() {
            const filtros = document.getElementById('masFiltros');
            const indicador = document.getElementById('indicador_filtros_activados');
            filtros.classList.toggle('hidden');
            indicador.classList.toggle('hidden');
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Contenedor principal con dos versiones (una para <1600px y otra para ≥1600px) -->
    <div class="sticky top-16 z-10 pt-5 pb-2 px-4">
        <div class="max-w-screen-2xl mx-auto">
            <!-- Card contenedora -->
            <div class="bg-white rounded-lg border border-gray-200 p-4">
                
                <!-- VERSIÓN PARA PANTALLAS GRANDES (≥1600px) - DOS FILAS CLARAS -->
                <div class="hidden widescreen:block">
                    <!-- Primera fila: Botones principales y exportación -->
                    <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-gray-100">
                        <!-- Grupo de botones principales -->
                        <div class="flex flex-wrap gap-2">
                            <button
                                type="button"
                                class="rounded-lg px-4 py-2 border border-indigo-600 hover:bg-indigo-50 text-sm font-medium text-white bg-indigo-600 hover:text-indigo-600 transition-colors flex items-center"
                                onclick="showConfirm('Esta acción de creación de fichaje quedará registrada<br>¿Desea continuar?',nuevoElemento,1,4,0);"
                            >
                                <i class="ti ti-plus mr-2"></i>
                                <span>Nuevo</span>
                            </button>
                            <button
                                type="button"
                                class="rounded-lg px-4 py-2 border border-indigo-600 hover:bg-indigo-50 text-sm font-medium text-white bg-indigo-600 hover:text-indigo-600 transition-colors flex items-center"
                                onclick="importaElementos(1,4);"
                            >
                                <i class="ti ti-file-import mr-2"></i>
                                <span>Importar</span>
                            </button>
                            <button
                                type="button"
                                class="rounded-lg px-4 py-2 border border-indigo-600 hover:bg-indigo-50 text-sm font-medium text-white bg-indigo-600 hover:text-indigo-600 transition-colors flex items-center"
                                onclick="sinFichajes(1,4,1);"
                            >
                                <i class="ti ti-user-off mr-2"></i>
                                <span>Sin Fichajes</span>
                            </button>
                            <button
                                type="button"
                                class="rounded-lg px-4 py-2 border border-indigo-600 hover:bg-indigo-50 text-sm font-medium text-white bg-indigo-600 hover:text-indigo-600 transition-colors flex items-center"
                                onclick="sinFichajes(1,4,2);"
                            >
                                <i class="ti ti-alert-triangle mr-2"></i>
                                <span>Fich. Desemp.</span>
                            </button>
                            <button
                                type="button"
                                class="rounded-lg px-4 py-2 border border-indigo-600 hover:bg-indigo-50 text-sm font-medium text-white bg-indigo-600 hover:text-indigo-600 transition-colors flex items-center"
                                onclick="showConfirm('Debe confirmar la acción de borrado<br>¿Desea continuar?',borrarMultiple,1,4);"
                            >
                                <i class="ti ti-trash mr-2"></i>
                                <span>Borrar</span>
                            </button>
                        </div>
                        
                        <!-- Exportación -->
                        <div class="flex gap-2">
                            <button 
                                class="px-4 py-2 border border-gray-200 rounded-lg hover:bg-green-50 transition-colors flex items-center"
                                onclick="imprimir(1,4,2,1);"
                                title="Exportar a Excel"
                            >
                                <i class="ti ti-file-spreadsheet text-green-600 mr-2"></i>
                                <span class="text-sm">Excel</span>
                            </button>
                            <button 
                                class="px-4 py-2 border border-gray-200 rounded-lg hover:bg-red-50 transition-colors flex items-center"
                                onclick="imprimir(1,4,1,1);"
                                title="Exportar a PDF"
                            >
                                <i class="ti ti-file-type-pdf text-red-600 mr-2"></i>
                                <span class="text-sm">PDF</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Segunda fila: Filtros y búsqueda -->
                    <div class="flex flex-wrap items-center gap-4 pt-4">
                        <!-- Filtro de fechas -->
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <i class="ti ti-calendar absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input
                                    type="text"
                                    name="fecha_inicio"
                                    id="fecha_inicio_wide"
                                    class="w-40 pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                                    placeholder="Inicio"
                                    value=""
                                />
                            </div>
                            <span class="text-gray-400">-</span>
                            <div class="relative">
                                <i class="ti ti-calendar absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input
                                    type="text"
                                    name="fecha_fin"
                                    id="fecha_fin_wide"
                                    class="w-40 pl-10 pr-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
                                    placeholder="Fin"
                                    value=""
                                />
                            </div>
                        </div>
                        
                        <!-- Selector rápido de fechas -->
                        <div class="relative w-48">
                            <select class="w-full pl-3 pr-8 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-gray-50 text-sm">
                                <option value="">Rango rápido</option>
                                <option value="1">Hoy</option>
                                <option value="2">Ayer</option>
                                <option value="3">Semana</option>
                                <option value="4">Mes</option>
                            </select>
                            <i class="ti ti-chevron-down absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 text-xs"></i>
                        </div>
                        
                        <!-- Filtro de empresas -->
                        <div class="relative w-56">
                            <select class="w-full pl-3 pr-8 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-gray-50 text-sm">
                                <option value="">Empresas</option>
                                <option value="1">ROI Network</option>
                                <option value="2">Empresa1</option>
                                <option value="3">Salud</option>
                            </select>
                            <i class="ti ti-chevron-down absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 text-xs"></i>
                        </div>
                        
                        <!-- Botones de acción -->
                        <div class="flex gap-2">
                            <button
                                class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center"
                                onclick="limpiarFiltros(1,4,1);"
                            >
                                <i class="ti ti-broom mr-2"></i>
                                <span>Limpiar</span>
                            </button>
                            <button
                                class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center relative"
                                onclick="toggleMasFiltros()"
                            >
                                <span id="indicador_filtros_activados_wide" class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 border-2 border-white rounded-full hidden"></span>
                                <i class="ti ti-filter mr-2"></i>
                                <span>Más filtros</span>
                            </button>
                            <button
                                class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center"
                                onclick="fechaBusqueda(1,4,2,1);"
                            >
                                <i class="ti ti-search mr-2"></i>
                                <span>Buscar</span>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- VERSIÓN PARA PANTALLAS PEQUEÑAS (<1600px) - UNA SOLA FILA -->
                <div class="widescreen:hidden flex flex-col md:flex-row gap-3 w-full items-center">
                    <!-- Grupo de botones principales -->
                    <div class="flex items-center w-full md:w-auto">
                        <div class="flex flex-wrap gap-1">
                            <!-- Botones principales (mismo estilo que tu versión original) -->
                            <button
                                type="button"
                                class="rounded-lg px-3 py-1.5 border border-indigo-600 hover:bg-indigo-50 text-sm font-medium text-white bg-indigo-600 hover:text-indigo-600 transition-colors flex items-center"
                                onclick="showConfirm('Esta acción de creación de fichaje quedará registrada<br>¿Desea continuar?',nuevoElemento,1,4,0);"
                            >
                                <i class="ti ti-plus mr-1"></i>
                                <span>Nuevo</span>
                            </button>
                            <!-- Resto de botones... -->
                        </div>
                    </div>

                    <!-- Grupo de filtros -->
                    <div class="flex-1 flex flex-wrap items-center gap-2 w-full min-w-0">
                        <!-- Filtros (mismo estilo que tu versión original) -->
                        <div class="grid grid-cols-2 gap-2">
                            <!-- Campos de fecha... -->
                        </div>
                        <!-- Resto de filtros... -->
                    </div>
                </div>
                
                <!-- Filtros avanzados (común a ambas versiones) -->
                <div id="masFiltros" class="hidden mt-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Filtro de centros -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Centro</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
                                <option value="">Todos</option>
                                <option value="1">CDMX Puebla</option>
                                <option value="2">Madrid</option>
                            </select>
                        </div>
                        
                        <!-- Filtro de departamentos -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Departamento</label>
                            <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
                                <option value="">Todos</option>
                                <option value="1">RRHH</option>
                                <option value="2">Desarrollo</option>
                            </select>
                        </div>
                        
                        <!-- Filtro de empleados -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Empleado</label>
                            <div class="flex">
                                <input 
                                    type="text" 
                                    id="empleado" 
                                    class="flex-1 px-3 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white"
                                    placeholder="Buscar..."
                                />
                                <button 
                                    class="px-3 py-2 bg-indigo-600 text-white rounded-r-lg hover:bg-indigo-700 transition-colors"
                                    onclick="filtraElemento(1,4,4,document.getElementById('empleado').value,1);"
                                >
                                    <i class="ti ti-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenido de ejemplo -->
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Listado de fichajes</h2>
            <p class="text-gray-600">Este sería el espacio para mostrar los resultados de los fichajes según los filtros aplicados.</p>
        </div>
    </div>

    <script>
        // Sincronización entre los inputs de ambas versiones
        document.addEventListener('DOMContentLoaded', function() {
            // Fechas
            const fechaInicioWide = document.getElementById('fecha_inicio_wide');
            const fechaFinWide = document.getElementById('fecha_fin_wide');
            const fechaInicio = document.getElementById('fecha_inicio');
            const fechaFin = document.getElementById('fecha_fin');
            
            // Establecer valores por defecto
            const today = new Date();
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const formatDate = (date) => date.toLocaleDateString('es-ES');
            
            if(fechaInicioWide) fechaInicioWide.value = formatDate(today);
            if(fechaInicio) fechaInicio.value = formatDate(today);
            if(fechaFinWide) fechaFinWide.value = formatDate(tomorrow);
            if(fechaFin) fechaFin.value = formatDate(tomorrow);
            
            // Sincronización entre versiones
            if(fechaInicioWide && fechaInicio) {
                fechaInicioWide.addEventListener('change', () => fechaInicio.value = fechaInicioWide.value);
                fechaInicio.addEventListener('change', () => fechaInicioWide.value = fechaInicio.value);
            }
            
            if(fechaFinWide && fechaFin) {
                fechaFinWide.addEventListener('change', () => fechaFin.value = fechaFinWide.value);
                fechaFin.addEventListener('change', () => fechaFinWide.value = fechaFin.value);
            }
        });
    </script>
</body>
</html>
