<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notificación de Cookies</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 p-4 font-sans">

    <!-- Tarjeta de cookies - 100% Tailwind, sin CSS extra -->
    <div class="max-w-[640px] w-full bg-white rounded-2xl shadow-xl shadow-gray-200/60 flex flex-col gap-4 p-4 sm:p-5 text-gray-600">

        <div class="flex flex-col gap-4">

            <!-- Título y descripción -->
            <div>
                <p class="text-sm sm:text-base font-semibold mb-1 text-gray-900 flex items-center gap-1">
                    🍪 Uso de cookies
                </p>
                <p class="text-xs sm:text-sm font-medium text-center sm:text-left text-gray-700 leading-relaxed">
                    Este servicio web utiliza cookies que permiten el funcionamiento y la prestación de servicios ofrecidos en el mismo. Las cookies esenciales están siempre habilitadas, ya que son necesarias para que el sitio web funcione correctamente.
                </p>
            </div>

            <!-- Fila: Política de Privacidad + botones -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-3 sm:gap-0">

                <!-- Enlace Política de Privacidad -->
                <a href="https://hypership.dev/privacy" target="_blank" rel="noopener noreferrer"
                class="text-xs font-medium text-gray-500 hover:text-gray-700 transition-colors duration-200 border-b border-transparent hover:border-gray-400 pb-0.5">
                Política de Privacidad
            </a>

            <!-- Grupo de botones -->
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">

                <!-- Gestionar Cookies -->
                <button class="px-3 py-1.5 text-xs font-medium rounded-md border border-blue-500 text-blue-500 bg-transparent hover:text-blue-600 hover:border-blue-600 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-0">
                    Gestionar Cookies
                </button>

                <!-- Rechazar Todo -->
                <button class="px-3 py-1.5 text-xs font-medium rounded-md bg-gray-200 hover:bg-gray-300 text-gray-800 transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-0">
                    Rechazar Todo
                </button>

                <!-- Aceptar Todo -->
                <button class="px-3 py-1.5 text-xs font-medium rounded-md bg-blue-500 hover:bg-blue-600 text-white transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-0">
                    Aceptar Todo
                </button>

            </div>
        </div>
    </div>
</div>

</body>
</html>
