<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Gestión de Delegaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header del módulo -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
            <!-- Controles del módulo - A la derecha -->
            <div class="p-4 bg-gray-50 flex flex-wrap gap-2 justify-end">
                <button id="selectAll" class="px-3 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-colors flex items-center gap-2 text-sm">
                    <i class="ti ti-square-check"></i>
                    Seleccionar Todos
                </button>
                <button id="deselectAll" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors flex items-center gap-2 text-sm">
                    <i class="ti ti-square-x"></i>
                    Deseleccionar Todos
                </button>
                <button id="expandAll" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-400 transition-colors flex items-center gap-2 text-sm">
                    <i class="ti ti-chevron-down"></i>
                </button>
                <button id="collapseAll" class="px-3 py-2 bg-gray-200 text-gray-700 rounded-full hover:bg-gray-400 transition-colors flex items-center gap-2 text-sm">
                  <i class="ti ti-chevron-up"></i>
                </button>
            </div>
        </div>

        <!-- Módulo de Delegaciones -->
        <div id="delegationsModule" class="space-y-4">
            <!-- Las delegaciones se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Módulo JavaScript para gestión de delegaciones -->
    <script>
        // Módulo de Datos - Separado de la UI
        const DelegationsDataModule = (() => {
            // Datos de ejemplo - en una app real vendrían de una API
            const delegationsData = [
                {
                    id: 1,
                    code: "C-02109524876",
                    name: "Centro administrativo principal",
                    employeeCount: 16,
                    employees: [
                        { id: "1-1", code: "4552", name: "AERONAUTICA", fullName: "4552-AERONAUTICA" },
                        { id: "1-2", code: "Q88388", name: "GUILLERMO ALONSO RAMOS", fullName: "Q88388-GUILLERMO ALONSO RAMOS" },
                        { id: "1-3", code: "055297", name: "HUGO AYAS RAMAJO", fullName: "055297-HUGO AYAS RAMAJO" },
                        { id: "1-4", code: "091732", name: "DANIEL BARROSO SAUGAR", fullName: "091732-DANIEL BARROSO SAUGAR" }
                    ]
                },
                {
                    id: 2,
                    code: "C-02109524876",
                    name: "Delegación Norte",
                    employeeCount: 8,
                    employees: [
                        { id: "2-1", code: "078432", name: "MARÍA LÓPEZ GARCÍA", fullName: "078432-MARÍA LÓPEZ GARCÍA" },
                        { id: "2-2", code: "091255", name: "CARLOS RUIZ MARTÍNEZ", fullName: "091255-CARLOS RUIZ MARTÍNEZ" }
                    ]
                },
                {
                    id: 3,
                    code: "C-02109524876",
                    name: "Delegación Sur",
                    employeeCount: 12,
                    employees: [
                        { id: "3-1", code: "034567", name: "ANA TORRES SÁNCHEZ", fullName: "034567-ANA TORRES SÁNCHEZ" },
                        { id: "3-2", code: "078901", name: "PEDRO JIMÉNEZ LÓPEZ", fullName: "078901-PEDRO JIMÉNEZ LÓPEZ" }
                    ]
                }
            ];

            return {
                getDelegations: () => {
                    return new Promise((resolve) => {
                        // Simular llamada a API
                        setTimeout(() => {
                            resolve([...delegationsData]);
                        }, 500);
                    });
                }
            };
        })();

        // Módulo de UI - Maneja la interfaz de usuario
        const DelegationsUIModule = (() => {
            const elements = {
                container: document.getElementById('delegationsModule'),
                selectAll: document.getElementById('selectAll'),
                deselectAll: document.getElementById('deselectAll'),
                expandAll: document.getElementById('expandAll'),
                collapseAll: document.getElementById('collapseAll')
            };

            // Estado de la UI
            const state = {
                selectedItems: new Set(),
                expandedGroups: new Set()
            };

            // Generar HTML para una delegación
            const createDelegationHTML = (delegation) => {
                const isExpanded = state.expandedGroups.has(delegation.id);
                const allEmployeesSelected = delegation.employees.every(emp => 
                    state.selectedItems.has(emp.id)
                );

                return `
                    <div class="bg-white rounded-lg border border-gray-200 shadow-sm fade-in" data-delegation-id="${delegation.id}">
                        <!-- Header de la delegación con código -->
                        <div class="bg-white border-b border-gray-200 rounded-t-lg">
                            <!-- Código de la delegación -->
                            <div class="p-4 border-b border-gray-100">
                                <p class="text-lg font-semibold text-gray-800">${delegation.code}</p>
                            </div>
                            
                            <!-- Información de la delegación -->
                            <div class="p-4 flex items-center space-x-3">
                                <input 
                                    type="checkbox" 
                                    id="delegation-group-${delegation.id}" 
                                    class="delegation-checkbox h-4 w-4 text-indigo-600 rounded focus:ring-indigo-500" 
                                    ${allEmployeesSelected ? 'checked' : ''}
                                    data-delegation-id="${delegation.id}"
                                >
                                <div class="flex-1 flex items-center justify-between">
                                    <label for="delegation-group-${delegation.id}" class="text-gray-800 font-medium cursor-pointer flex items-center">
                                        <button class="expand-toggle mr-2 text-gray-500 hover:text-gray-700" data-delegation-id="${delegation.id}">
                                            <i class="ti ti-chevron-right transition-transform ${isExpanded ? 'rotate-90' : ''}"></i>
                                        </button>
                                        ${delegation.name}
                                    </label>
                                </div>
                                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">${delegation.employeeCount} empleados</span>
                            </div>
                        </div>
                        
                        <!-- Empleados de la delegación -->
                        <div class="employees-container divide-y divide-gray-100 ${isExpanded ? '' : 'hidden'}">
                            ${delegation.employees.map(employee => `
                                <div class="p-3 pl-12 flex items-center space-x-3 hover:bg-gray-50 transition-colors">
                                    <input 
                                        type="checkbox" 
                                        id="employee-${employee.id}" 
                                        class="employee-checkbox h-4 w-4 text-indigo-600 rounded focus:ring-indigo-500" 
                                        ${state.selectedItems.has(employee.id) ? 'checked' : ''}
                                        data-employee-id="${employee.id}"
                                        data-delegation-id="${delegation.id}"
                                    >
                                    <label for="employee-${employee.id}" class="text-gray-700 cursor-pointer text-sm flex-1">
                                        ${employee.fullName}
                                    </label>
                                    <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">${employee.code}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            return {
                // Renderizar delegaciones
                renderDelegations: (delegations) => {
                    elements.container.innerHTML = delegations.map(createDelegationHTML).join('');
                },

                // Mostrar estado de carga
                setLoadingState: (isLoading) => {
                    if (isLoading) {
                        elements.container.innerHTML = `
                            <div class="bg-white rounded-lg border border-gray-200 p-8 text-center">
                                <i class="ti ti-loader-2 animate-spin text-4xl text-indigo-600 mb-4"></i>
                                <p class="text-gray-600">Cargando delegaciones...</p>
                            </div>
                        `;
                    }
                },

                // Obtener estado actual
                getState: () => ({ ...state }),

                // Actualizar estado
                updateState: (newState) => {
                    Object.assign(state, newState);
                },

                // Obtener elementos
                getElements: () => elements
            };
        })();

        // Módulo Controlador - Coordina datos y UI
        const DelegationsController = (() => {
            const ui = DelegationsUIModule;
            const data = DelegationsDataModule;
            const elements = ui.getElements();

            // Manejar selección de delegación (grupo)
            const handleDelegationSelection = (delegationId, isChecked) => {
                const state = ui.getState();
                const delegationElement = document.querySelector(`[data-delegation-id="${delegationId}"]`);
                const employeeCheckboxes = delegationElement.querySelectorAll('.employee-checkbox');

                employeeCheckboxes.forEach(checkbox => {
                    const employeeId = checkbox.dataset.employeeId;
                    
                    if (isChecked) {
                        state.selectedItems.add(employeeId);
                        checkbox.checked = true;
                    } else {
                        state.selectedItems.delete(employeeId);
                        checkbox.checked = false;
                    }
                });

                ui.updateState(state);
            };

            // Manejar selección individual de empleado
            const handleEmployeeSelection = (employeeId, delegationId, isChecked) => {
                const state = ui.getState();
                
                if (isChecked) {
                    state.selectedItems.add(employeeId);
                } else {
                    state.selectedItems.delete(employeeId);
                }

                // Actualizar estado del checkbox de delegación
                const delegationElement = document.querySelector(`[data-delegation-id="${delegationId}"]`);
                const employeeCheckboxes = delegationElement.querySelectorAll('.employee-checkbox');
                const allSelected = Array.from(employeeCheckboxes).every(cb => cb.checked);
                const delegationCheckbox = delegationElement.querySelector('.delegation-checkbox');
                
                delegationCheckbox.checked = allSelected;
                delegationCheckbox.indeterminate = !allSelected && Array.from(employeeCheckboxes).some(cb => cb.checked);

                ui.updateState(state);
            };

            // Expandir/colapsar delegación
            const toggleDelegationExpansion = (delegationId) => {
                const state = ui.getState();
                const employeesContainer = document.querySelector(`[data-delegation-id="${delegationId}"] .employees-container`);
                const toggleButton = document.querySelector(`[data-delegation-id="${delegationId}"] .expand-toggle`);
                const toggleIcon = toggleButton.querySelector('i');

                if (state.expandedGroups.has(delegationId)) {
                    state.expandedGroups.delete(delegationId);
                    employeesContainer.classList.add('hidden');
                    toggleIcon.classList.remove('rotate-90');
                } else {
                    state.expandedGroups.add(delegationId);
                    employeesContainer.classList.remove('hidden');
                    toggleIcon.classList.add('rotate-90');
                }

                ui.updateState(state);
            };

            // Inicializar event listeners
            const initEventListeners = () => {
                // Delegación checkbox change
                elements.container.addEventListener('change', (e) => {
                    if (e.target.classList.contains('delegation-checkbox')) {
                        const delegationId = e.target.dataset.delegationId;
                        handleDelegationSelection(delegationId, e.target.checked);
                    }
                    
                    if (e.target.classList.contains('employee-checkbox')) {
                        const employeeId = e.target.dataset.employeeId;
                        const delegationId = e.target.dataset.delegationId;
                        handleEmployeeSelection(employeeId, delegationId, e.target.checked);
                    }
                });

                // Expandir/colapsar delegaciones
                elements.container.addEventListener('click', (e) => {
                    if (e.target.classList.contains('expand-toggle') || e.target.closest('.expand-toggle')) {
                        const button = e.target.classList.contains('expand-toggle') ? e.target : e.target.closest('.expand-toggle');
                        const delegationId = button.dataset.delegationId;
                        toggleDelegationExpansion(delegationId);
                    }
                });

                // Botones de control
                elements.selectAll.addEventListener('click', () => {
                    const checkboxes = elements.container.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(cb => {
                        cb.checked = true;
                        cb.dispatchEvent(new Event('change'));
                    });
                });

                elements.deselectAll.addEventListener('click', () => {
                    const checkboxes = elements.container.querySelectorAll('input[type="checkbox"]');
                    checkboxes.forEach(cb => {
                        cb.checked = false;
                        cb.dispatchEvent(new Event('change'));
                    });
                });

                elements.expandAll.addEventListener('click', () => {
                    const toggleButtons = elements.container.querySelectorAll('.expand-toggle');
                    toggleButtons.forEach(button => {
                        const delegationId = button.dataset.delegationId;
                        const state = ui.getState();
                        if (!state.expandedGroups.has(delegationId)) {
                            toggleDelegationExpansion(delegationId);
                        }
                    });
                });

                elements.collapseAll.addEventListener('click', () => {
                    const toggleButtons = elements.container.querySelectorAll('.expand-toggle');
                    toggleButtons.forEach(button => {
                        const delegationId = button.dataset.delegationId;
                        const state = ui.getState();
                        if (state.expandedGroups.has(delegationId)) {
                            toggleDelegationExpansion(delegationId);
                        }
                    });
                });
            };

            // Cargar y renderizar delegaciones
            const loadDelegations = async () => {
                ui.setLoadingState(true);
                
                try {
                    const delegations = await data.getDelegations();
                    ui.renderDelegations(delegations);
                } catch (error) {
                    console.error('Error al cargar las delegaciones:', error);
                }
            };

            // Inicializar módulo
            const init = () => {
                initEventListeners();
                loadDelegations();
                
                console.log('Módulo de delegaciones inicializado correctamente');
            };

            return {
                init,
                loadDelegations
            };
        })();

        // Inicializar la aplicación cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            DelegationsController.init();
        });
    </script>
</body>
</html>
