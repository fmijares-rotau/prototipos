<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Widget Viajes</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { background: #f8fafc; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">







  

  <!-- 1. Viajes -->
  <div class="w-full max-w-[530px] rounded-2xl border border-slate-200 bg-white p-4 sm:p-6 font-['DM_Sans']">

    <!-- Header: se apila en móvil, en fila desde sm -->
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-5">
      <h2 class="text-xl font-medium text-indigo-800">Viajes</h2>
      <div class="flex items-center gap-3">
        <button class="flex items-center gap-2 px-3 py-1.5 text-sm text-slate-500 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition whitespace-nowrap">
          Filtrar estados <i class="ti ti-chevron-down text-sm"></i>
        </button>
        <button class="flex items-center justify-center w-8 h-8 shrink-0 bg-white border border-gray-200 rounded-full hover:bg-gray-50 transition">
          <i class="ti ti-chevron-right text-sm text-slate-500"></i>
        </button>
      </div>
    </div>

    <hr class="my-5 border-gray-200" />

    <div class="flex flex-col gap-3">

      <!-- Item 1 -->
      <div class="relative flex items-center justify-between gap-3 rounded-xl bg-slate-50 p-4 pl-11">
        <i class="ti ti-plane absolute left-4 top-4 text-slate-500"></i>
        <div class="flex min-w-0 flex-col gap-2">
          <p class="truncate text-base font-medium text-slate-800">Viaje a Chile – Reunión con cliente</p>
          <div class="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[13px] text-slate-400">
            <span class="whitespace-nowrap">01 Mar, 15:00</span>
            <i class="ti ti-arrow-right text-slate-400 shrink-0"></i>
            <span class="whitespace-nowrap">16 Mar, 20:00</span>
            <span class="ml-1 shrink-0 rounded-full bg-slate-200 px-1.5 py-0.5 text-[11px] font-medium text-slate-500">2025</span>
          </div>
        </div>
        <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-amber-400">
          <i class="ti ti-alert-circle text-white text-sm"></i>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="relative flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 p-4 pl-11">
        <i class="ti ti-plane absolute left-4 top-4 text-slate-500"></i>
        <div class="flex min-w-0 flex-col gap-2">
          <p class="truncate text-[15px] font-bold text-slate-800">Viaje a Barcelona – Conferencia</p>
          <div class="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[13px] text-slate-400">
            <span class="whitespace-nowrap">25 Mar, 10:00</span>
            <i class="ti ti-arrow-right text-slate-400 shrink-0"></i>
            <span class="whitespace-nowrap">13 Abr, 16:00</span>
            <span class="ml-1 shrink-0 rounded-full bg-slate-200 px-1.5 py-0.5 text-[11px] font-medium text-slate-500">2025</span>
          </div>
        </div>
        <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-emerald-400">
          <i class="ti ti-check text-white text-sm"></i>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="relative flex items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 p-4 pl-11">
        <i class="ti ti-plane absolute left-4 top-4 text-slate-500"></i>
        <div class="flex min-w-0 flex-col gap-2">
          <p class="truncate text-[15px] font-bold text-slate-800">Viaje a Sevilla – Capacitación</p>
          <div class="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[13px] text-slate-400">
            <span class="whitespace-nowrap">03 Mar, 15:00</span>
            <i class="ti ti-arrow-right text-slate-400 shrink-0"></i>
            <span class="whitespace-nowrap">12 Mar, 20:00</span>
            <span class="ml-1 shrink-0 rounded-full bg-slate-200 px-1.5 py-0.5 text-[11px] font-medium text-slate-500">2025</span>
          </div>
        </div>
        <div class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-red-400">
          <i class="ti ti-x text-white text-sm"></i>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
