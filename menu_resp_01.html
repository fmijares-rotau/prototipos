<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Gestión Documentos - Tarjeta Única</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <!-- Estilos mínimos para el acordeón (solo transiciones) -->
  <style>
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease-out, padding 0.2s ease;
      padding-left: 0.75rem;
      padding-right: 0.75rem;
    }
    .accordion-item.open .accordion-content {
      max-height: 380px;
      padding-bottom: 0.75rem;
    }
    button:focus {
      outline: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#667eea] to-[#764ba2] min-h-screen flex items-center justify-center p-2 font-sans">
  
  <!-- Marco móvil compacto -->
  <div class="bg-white rounded-[2rem] border-[6px] border-[#121212] shadow-xl max-w-[370px] w-full overflow-hidden">
    
    <!-- Notch -->
    <div class="bg-[#121212] h-5 flex justify-center items-center text-[10px] font-medium text-gray-200 tracking-wide">9:41</div>
    
    <!-- Contenido principal -->
    <div class="bg-[#f8f9fe] p-2">
      
      <!-- TARJETA ÚNICA: Botones + Filtros (todo junto sin separación) -->
      <div class="bg-white rounded-xl border-[0.5px] border-gray-100 overflow-hidden shadow-sm mb-2">
        
        <!-- Botones principales (Nuevo + 3 columnas) -->
        <div class="p-2 pb-1">
          <button onclick="nuevoDocumento()" class="w-full bg-[#5B3FB8] text-white font-semibold py-1.5 rounded-lg flex items-center justify-center gap-1.5 text-xs active:scale-95 transition-transform mb-1.5">
            <i class="ti ti-plus text-sm"></i> Nuevo
          </button>
          <div class="grid grid-cols-3 gap-1">
            <button onclick="importarDocs()" class="bg-white border-[0.5px] border-gray-300 text-gray-800 font-semibold py-1 rounded-lg flex items-center justify-center gap-1 text-[11px] active:scale-95 transition-transform">
              <i class="ti ti-upload text-xs"></i> Importar
            </button>
            <button onclick="validosFilter()" class="bg-[#4CAF50] border-[0.5px] border-[#4CAF50] text-white font-semibold py-1 rounded-lg flex items-center justify-center gap-1 text-[11px] active:scale-95 transition-transform">
              <i class="ti ti-checkbox text-xs"></i> Válidos
            </button>
            <button onclick="incidenciasFilter()" class="bg-[#FF9800] border-[0.5px] border-[#FF9800] text-white font-semibold py-1 rounded-lg flex items-center justify-center gap-1 text-[11px] active:scale-95 transition-transform">
              <i class="ti ti-alert-triangle text-xs"></i> Incidencias
            </button>
          </div>
        </div>
        
        <!-- Acordeón de filtros (integrado en la misma tarjeta, sin bordes adicionales) -->
        <div class="accordion-item open border-t-[0.5px] border-gray-100" id="filterAccordion">
          <button class="accordion-header w-full flex justify-between items-center px-3 py-2 text-xs font-semibold text-[#1a1a2e] bg-white" onclick="toggleAccordion(event)">
            <span class="flex items-center gap-1.5"><i class="ti ti-filter text-sm"></i> Filtros</span>
            <i class="ti ti-chevron-down text-xs transition-transform duration-200 arrow-icon"></i>
          </button>
          <div class="accordion-content">
            <div class="grid grid-cols-2 gap-1.5 mb-1.5">
              <div class="flex flex-col gap-0.5">
                <label class="text-[9px] font-bold text-gray-500 uppercase">Desde</label>
                <input type="date" id="fechaDesde" class="border-[0.5px] border-gray-300 rounded-lg text-xs py-1 px-2 bg-white">
              </div>
              <div class="flex flex-col gap-0.5">
                <label class="text-[9px] font-bold text-gray-500 uppercase">Hasta</label>
                <input type="date" id="fechaHasta" class="border-[0.5px] border-gray-300 rounded-lg text-xs py-1 px-2 bg-white">
              </div>
              <div class="col-span-2 flex flex-col gap-0.5">
                <label class="text-[9px] font-bold text-gray-500 uppercase">Período</label>
                <select id="periodoSelect" class="border-[0.5px] border-gray-300 rounded-lg text-xs py-1 px-2 bg-white">
                  <option value="">Seleccionar período</option>
                  <option>Hoy</option>
                  <option>Esta semana</option>
                  <option>Este mes</option>
                  <option>Este trimestre</option>
                  <option>Personalizado</option>
                </select>
              </div>
              <div class="col-span-2 flex flex-col gap-0.5">
                <label class="text-[9px] font-bold text-gray-500 uppercase">Empresa</label>
                <select id="empresaSelect" class="border-[0.5px] border-gray-300 rounded-lg text-xs py-1 px-2 bg-white">
                  <option>Todas las empresas</option>
                  <option>Empresa A</option>
                  <option>Empresa B</option>
                  <option>Empresa C</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-1.5 mt-1">
              <button onclick="limpiarFiltros()" class="bg-white border-[0.5px] border-gray-300 rounded-lg py-1 text-[10px] font-semibold flex items-center justify-center gap-1"><i class="ti ti-eraser text-xs"></i> Limpiar</button>
              <button onclick="buscar()" class="bg-[#5B3FB8] text-white rounded-lg py-1 text-[10px] font-semibold flex items-center justify-center gap-1"><i class="ti ti-search text-xs"></i> Buscar</button>
            </div>
            <div class="mt-2 pt-1.5 border-t-[0.5px] border-gray-100">
              <span class="text-[9px] font-bold text-gray-700 block mb-1">Descargar como:</span>
              <div class="grid grid-cols-2 gap-1.5">
                <button onclick="exportar('excel')" class="bg-white border-[0.5px] border-gray-300 rounded-lg py-1 text-[10px] font-semibold flex items-center justify-center gap-1"><i class="ti ti-file-spreadsheet text-xs"></i> Excel</button>
                <button onclick="exportar('pdf')" class="bg-white border-[0.5px] border-gray-300 rounded-lg py-1 text-[10px] font-semibold flex items-center justify-center gap-1"><i class="ti ti-file-pdf text-xs"></i> PDF</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- BOTONES INFERIORES (tarjeta separada) -->
      <div class="grid grid-cols-3 gap-1 bg-white rounded-xl border-[0.5px] border-gray-100 p-1.5 shadow-sm">
        <button onclick="accionVer()" class="flex flex-col items-center gap-0.5 py-1 text-[9px] font-semibold text-gray-700 active:scale-95 transition-transform"><i class="ti ti-eye text-base"></i> Ver</button>
        <button onclick="accionEditar()" class="flex flex-col items-center gap-0.5 py-1 text-[9px] font-semibold text-gray-700 active:scale-95 transition-transform"><i class="ti ti-edit text-base"></i> Editar</button>
        <button onclick="accionEliminar()" class="flex flex-col items-center gap-0.5 py-1 text-[9px] font-semibold text-gray-700 active:scale-95 transition-transform"><i class="ti ti-trash text-base"></i> Eliminar</button>
      </div>
      
    </div>
  </div>

  <script>
    // Toggle acordeón con rotación del ícono
    function toggleAccordion(event) {
      const btn = event.currentTarget;
      const item = btn.closest('.accordion-item');
      if (!item) return;
      const isOpen = item.classList.contains('open');
      if (isOpen) {
        item.classList.remove('open');
        const arrow = btn.querySelector('.arrow-icon');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      } else {
        item.classList.add('open');
        const arrow = btn.querySelector('.arrow-icon');
        if (arrow) arrow.style.transform = 'rotate(180deg)';
      }
    }
    
    // Acciones de búsqueda y filtros
    function buscar() {
      const desde = document.getElementById('fechaDesde')?.value || '—';
      const hasta = document.getElementById('fechaHasta')?.value || '—';
      const periodo = document.getElementById('periodoSelect')?.value || 'ninguno';
      const empresa = document.getElementById('empresaSelect')?.value || 'todas';
      alert(`🔎 Búsqueda aplicada\n📅 ${desde} → ${hasta}\n📁 ${periodo}\n🏢 ${empresa}`);
    }
    
    function limpiarFiltros() {
      document.getElementById('fechaDesde').value = '';
      document.getElementById('fechaHasta').value = '';
      document.getElementById('periodoSelect').selectedIndex = 0;
      document.getElementById('empresaSelect').selectedIndex = 0;
      alert('🧹 Filtros limpiados');
    }
    
    function exportar(formato) {
      alert(`📎 Exportando a ${formato.toUpperCase()}`);
    }
    
    // Acciones botones principales
    function nuevoDocumento() { alert("📄 Nuevo documento"); }
    function importarDocs() { alert("📂 Importar archivos"); }
    function validosFilter() { alert("✅ Documentos válidos"); }
    function incidenciasFilter() { alert("⚠️ Documentos con incidencias"); }
    
    // Acciones botones inferiores
    function accionVer() { alert("👁️ Ver detalles"); }
    function accionEditar() { alert("✏️ Editar documento"); }
    function accionEliminar() { 
      if (confirm("¿Eliminar permanentemente?")) alert("🗑️ Eliminado"); 
      else alert("Cancelado");
    }
    
    // Auto completar fechas según período
    function autoRangoPeriodo() {
      const periodo = document.getElementById('periodoSelect')?.value;
      if (!periodo || periodo === 'Personalizado' || periodo === 'Seleccionar período') return;
      const hoy = new Date();
      const format = d => d.toISOString().split('T')[0];
      let desde = null, hasta = null;
      if (periodo === 'Hoy') {
        desde = hasta = format(hoy);
      } else if (periodo === 'Esta semana') {
        const dia = hoy.getDay();
        const inicio = new Date(hoy);
        inicio.setDate(hoy.getDate() - dia + (dia === 0 ? -6 : 1));
        const fin = new Date(inicio);
        fin.setDate(inicio.getDate() + 6);
        desde = format(inicio);
        hasta = format(fin);
      } else if (periodo === 'Este mes') {
        const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
        const fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0);
        desde = format(inicio);
        hasta = format(fin);
      } else if (periodo === 'Este trimestre') {
        const trim = Math.floor(hoy.getMonth() / 3);
        const inicio = new Date(hoy.getFullYear(), trim * 3, 1);
        const fin = new Date(hoy.getFullYear(), trim * 3 + 3, 0);
        desde = format(inicio);
        hasta = format(fin);
      }
      if (desde && hasta) {
        document.getElementById('fechaDesde').value = desde;
        document.getElementById('fechaHasta').value = hasta;
      }
    }
    
    // Inicializar eventos
    document.addEventListener('DOMContentLoaded', () => {
      const periodoEl = document.getElementById('periodoSelect');
      if (periodoEl) periodoEl.addEventListener('change', autoRangoPeriodo);
      // Rotar ícono flecha si el acordeón está abierto por defecto
      const openItem = document.querySelector('.accordion-item.open');
      if (openItem) {
        const arrow = openItem.querySelector('.arrow-icon');
        if (arrow) arrow.style.transform = 'rotate(180deg)';
      }
    });
  </script>
</body>
</html>
