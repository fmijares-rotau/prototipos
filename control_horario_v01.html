// Animación del menú hamburguesa
function toggleMenu() {
    const btn = document.getElementById("logoCabecera");
    const isExpanded = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", !isExpanded);

    // Animación de las líneas del menú
    const top = document.getElementById("hamburgerTop");
    const middle = document.getElementById("hamburgerMiddle");
    const bottom = document.getElementById("hamburgerBottom");

    if (!isExpanded) {
        top.style.transform = "translateY(6px) rotate(45deg)";
        middle.style.opacity = "0";
        bottom.style.transform = "translateY(-6px) rotate(-45deg)";
    } else {
        top.style.transform = "";
        middle.style.opacity = "";
        bottom.style.transform = "";
    }
}

// Función para el toggle de vista detallada
document.getElementById('detailedViewToggle').addEventListener('change', function() {
    const isChecked = this.checked;
    const details = document.querySelectorAll('.detailed-view');
    details.forEach(detail => detail.style.display = isChecked ? 'block' : 'none');
});

// Función para el scroll con arrastre
const slider = document.getElementById('scrollableTable');
let isDown = false;
let startX;
let scrollLeft;

slider.addEventListener('mousedown', (e) => {
    isDown = true;
    slider.style.cursor = 'grabbing';
    startX = e.pageX - slider.offsetLeft;
    scrollLeft = slider.scrollLeft;
});

slider.addEventListener('mouseleave', () => {
    isDown = false;
    slider.style.cursor = 'grab';
});

slider.addEventListener('mouseup', () => {
    isDown = false;
    slider.style.cursor = 'grab';
});

slider.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - slider.offsetLeft;
    const walk = (x - startX) * 2;
    slider.scrollLeft = scrollLeft - walk;
});

// Funciones del calendario
document.addEventListener('DOMContentLoaded', function() {
    // Variables de estado
    let currentDate = new Date(2025, 7, 1); // Agosto 2025
    let startDate = null;
    let endDate = null;
    let selecting = false;
    let activeInput = null;
    
    // Elementos del DOM
    const calendarDays = document.getElementById('calendarDays');
    const currentMonthElement = document.getElementById('currentMonth');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const fechaInicioInput = document.getElementById('fecha_inicio');
    const fechaFinInput = document.getElementById('fecha_fin');
    const prevMonthButton = document.getElementById('prevMonth');
    const nextMonthButton = document.getElementById('nextMonth');
    const applyButton = document.getElementById('applyBtn');
    const calendarContainer = document.getElementById('calendarContainer');
    const dateInputs = document.querySelectorAll('.date-input');
    
    // Nombres de meses y días
    const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", 
                       "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const dayNames = ["Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sá"];
    
    // Mostrar/ocultar calendario cuando se hace clic en los inputs de fecha
    dateInputs.forEach(input => {
        input.addEventListener('click', function(e) {
            // Posicionar el calendario debajo del input actual
            const rect = this.getBoundingClientRect();
            calendarContainer.style.top = `${rect.bottom + window.scrollY + 5}px`;
            calendarContainer.style.left = `${rect.left + window.scrollX}px`;
            
            // Mostrar calendario
            calendarContainer.classList.add('calendar-visible');
            
            // Determinar qué input está activo
            if (this.id === 'fecha_inicio') {
                activeInput = 'start';
                if (startDate) {
                    currentDate = new Date(startDate);
                }
            } else {
                activeInput = 'end';
                if (endDate) {
                    currentDate = new Date(endDate);
                }
            }
            
            renderCalendar();
            
            e.stopPropagation();
        });
    });
    
    // Ocultar calendario cuando se hace clic fuera
    document.addEventListener('click', function(e) {
        if (!calendarContainer.contains(e.target) && !e.target.classList.contains('date-input')) {
            calendarContainer.classList.remove('calendar-visible');
        }
    });
    
    // Prevenir que el clic en el calendario lo oculte
    calendarContainer.addEventListener('click', function(e) {
        e.stopPropagation();
    });
    
    // Inicializar el calendario
    function renderCalendar() {
        // Limpiar el calendario
        calendarDays.innerHTML = '';
        
        // Establecer el texto del mes actual
        currentMonthElement.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        
        // Obtener el primer día del mes y el último día del mes
        const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
        const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
        
        // Días del mes anterior (para completar la primera semana)
        const prevMonthLastDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0).getDate();
        const firstDayIndex = firstDay.getDay();
        
        // Días del próximo mes (para completar la última semana)
        const daysInMonth = lastDay.getDate();
        
        // Generar días del mes anterior
        for (let i = firstDayIndex; i > 0; i--) {
            const day = prevMonthLastDay - i + 1;
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, day);
            const dayElement = createDayElement(day, date, true);
            calendarDays.appendChild(dayElement);
        }
        
        // Generar días del mes actual
        for (let i = 1; i <= daysInMonth; i++) {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), i);
            const dayElement = createDayElement(i, date, false);
            calendarDays.appendChild(dayElement);
        }
        
        // Calcular cuántos días del próximo mes necesitamos mostrar
        const lastDayIndex = lastDay.getDay();
        const nextDays = 7 - lastDayIndex - 1;
        
        // Generar días del próximo mes
        for (let i = 1; i <= nextDays; i++) {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, i);
            const dayElement = createDayElement(i, date, true);
            calendarDays.appendChild(dayElement);
        }
        
        updateSelectedRange();
    }
    
    // Crear elemento de día
    function createDayElement(day, date, isOtherMonth) {
        const dayElement = document.createElement('div');
        dayElement.className = `text-center p-2 rounded-full cursor-pointer transition ${isOtherMonth ? 'text-gray-400' : 'text-gray-700 hover:bg-gray-200'}`;
        dayElement.textContent = day;
        
        // Comprobar si el día está seleccionado
        if (isDateSelected(date)) {
            dayElement.classList.add('bg-blue-500', 'text-white');
        } else if (isDateInRange(date)) {
            dayElement.classList.add('bg-blue-100');
        }
        
        // Añadir evento de clic
        dayElement.addEventListener('click', () => selectDate(date));
        
        return dayElement;
    }
    
    // Comprobar si una fecha está seleccionada
    function isDateSelected(date) {
        return (startDate && isSameDay(date, startDate)) || (endDate && isSameDay(date, endDate));
    }
    
    // Comprobar si una fecha está en el rango seleccionado
    function isDateInRange(date) {
        if (!startDate || !endDate) return false;
        
        const time = date.getTime();
        return time > startDate.getTime() && time < endDate.getTime();
    }
    
    // Comprobar si dos fechas son el mismo día
    function isSameDay(date1, date2) {
        return date1.getDate() === date2.getDate() &&
               date1.getMonth() === date2.getMonth() &&
               date1.getFullYear() === date2.getFullYear();
    }
    
    // Seleccionar fecha
    function selectDate(date) {
        if (activeInput === 'start') {
            startDate = date;
            startDateInput.value = formatDate(date);
            fechaInicioInput.value = formatShortDate(date);
            
            // Si ya hay una fecha de fin y es anterior a la de inicio, resetear la de fin
            if (endDate && date > endDate) {
                endDate = null;
                endDateInput.value = '';
                fechaFinInput.value = '';
            }
            
            // Cambiar al input de fin
            activeInput = 'end';
        } else {
            endDate = date;
            endDateInput.value = formatDate(date);
            fechaFinInput.value = formatShortDate(date);
            
            // Si ya hay una fecha de inicio y es posterior a la de fin, resetear la de inicio
            if (startDate && date < startDate) {
                startDate = null;
                startDateInput.value = '';
                fechaInicioInput.value = '';
            }
            
            // Cambiar al input de inicio
            activeInput = 'start';
        }
        
        renderCalendar();
    }
    
    // Actualizar el rango seleccionado en el calendario
    function updateSelectedRange() {
        const days = calendarDays.querySelectorAll('div');
        
        days.forEach(dayElement => {
            // Esta función ahora se maneja en createDayElement
        });
    }
    
    // Formatear fecha como string (versión larga)
    function formatDate(date) {
        if (!date) return '';
        return `${date.getDate()} de ${monthNames[date.getMonth()]} de ${date.getFullYear()}`;
    }
    
    // Formatear fecha como string (versión corta)
    function formatShortDate(date) {
        if (!date) return '';
        return `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()}`;
    }
    
    // Navegación entre meses
    prevMonthButton.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });
    
    nextMonthButton.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });
    
    // Aplicar el rango seleccionado
    applyButton.addEventListener('click', () => {
        if (startDate && endDate) {
            calendarContainer.classList.remove('calendar-visible');
        } else {
            alert('Por favor, selecciona un rango de fechas completo');
        }
    });
    
    // Inicializar el calendario
    renderCalendar();
});
