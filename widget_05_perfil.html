<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Widget Mis Datos · Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#412DB6',
          'primary-light': '#6C63FF',
          'primary-soft': '#F4F2FB',
          'text-primary': '#101928',
          'text-secondary': '#2D3748',
          'text-tertiary': '#475467',
          'text-muted': '#718096',
          'text-placeholder': '#98A2B3',
          success: '#50C878',
          'success-soft': '#ECFDF3',
          warning: '#F8B730',
          'warning-soft': '#FFFAEB',
          danger: '#FD5B55',
          'danger-soft': '#FEF3F2',
          info: '#1BA1EB',
          'info-soft': '#EFF8FF',
          background: '#F5F7FB',
          'surface-secondary': '#F8FAFB',
          'surface-muted': '#F8FAFC',
          border: '#E4E7EC',
        },
        fontFamily: {
          'dm-sans': ['DM Sans', 'sans-serif'],
        },
        fontSize: {
          'xxs': ['11px', { lineHeight: '1.4' }],
        },
        borderRadius: {
          '2xl': '20px',
        }
      }
    }
  }
</script>
<style>
  .widget-card {
    transition: all 0.2s ease;
  }
  .widget-card:hover {
    box-shadow: 0 8px 30px rgba(65, 45, 182, 0.08);
  }
  .avatar-ring {
    background: linear-gradient(135deg, #412DB6, #6C63FF, #F8B730);
    padding: 3px;
    border-radius: 9999px;
  }
  .avatar-ring-inner {
    background: white;
    border-radius: 9999px;
    padding: 3px;
  }
  .action-btn {
    position: relative;
    overflow: hidden;
  }
  .action-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(65, 45, 182, 0.05), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 8px;
  }
  .action-btn:hover::after {
    opacity: 1;
  }
  .action-btn:hover {
    color: #412DB6;
  }
  .badge {
    transition: all 0.2s ease;
  }
  .badge:hover {
    transform: scale(1.02);
  }
  .online-dot {
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .clock-in-badge {
    animation: slide-in 0.5s ease-out;
  }
  @keyframes slide-in {
    0% { transform: translateY(-10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-background font-dm-sans">

  <!-- Mis Datos - Con fichaje de entrada -->
  <div class="w-full max-w-[420px] rounded-2xl border border-border bg-white p-4 sm:p-6 font-dm-sans widget-card">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2">
       
        <h2 class="text-xl font-medium text-primary">Mis datos</h2>
      </div>
      <button class="flex items-center justify-center w-8 h-8 shrink-0 bg-surface-secondary border border-border rounded-full hover:bg-primary-soft hover:border-primary transition group">
        <i class="ti ti-chevron-right text-sm text-text-tertiary group-hover:text-primary transition"></i>
      </button>
    </div>

    <hr class="mb-5 border-border" />

    <!-- Perfil -->
    <div class="relative rounded-xl bg-gradient-to-br from-surface-secondary to-white border border-border p-5 overflow-hidden">
     

      <div class="relative flex items-center gap-5">
        <!-- Avatar -->
        <div class="relative shrink-0">
          <div class="avatar-ring">
            <div class="avatar-ring-inner">
              <img
                src="https://i.pravatar.cc/150?img=11"
                alt="Foto de José López"
                class="h-20 w-20 rounded-full object-cover"
              />
            </div>
          </div>
        
        </div>

        <!-- Información del usuario -->
        <div class="flex min-w-0 flex-col gap-1.5 flex-1">
          <div class="flex items-center gap-2">
            <p class="truncate text-base font-bold text-text-primary">José López</p>
            <span class="shrink-0 inline-flex items-center gap-0.5 text-success text-xxs font-medium">
              <i class="ti ti-circle-check-filled text-sm"></i>
            </span>
          </div>
          <p class="text-sm text-text-muted flex items-center gap-1">
            <i class="ti ti-mail text-sm"></i>
            jose.lopez@empresa1.com
          </p>
         
        </div>
      </div>

      <!-- Estado de Fichaje - Entrada registrada -->
      <div class="relative mt-4 flex items-center justify-between rounded-lg bg-success-soft border border-success/20 p-3 clock-in-badge">
        <div class="flex items-center gap-2.5">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-success/20">
            <i class="ti ti-clock-check text-success text-base"></i>
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-semibold text-success">Entrada registrada</span>
            <span class="text-xxs text-text-muted">Hoy · 08:35 h</span>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="inline-flex h-2 w-2 rounded-full bg-success animate-pulse"></span>
          <span class="text-xxs font-medium text-success">En curso</span>
        </div>
      </div>
    </div>


    <!-- Línea inferior con estado de fichaje -->
    <div class="mt-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        
        <span class="text-xs text-text-placeholder">Último acceso: hoy 14:30</span>
      </div>
     
    </div>

  </div>

</body>
</html>
