<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtros en Una Línea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        .calendar-day {
            @apply w-9 h-9 flex items-center justify-center rounded-lg text-sm cursor-pointer hover:bg-indigo-50 transition-colors;
        }
        .calendar-day.selected {
            @apply bg-indigo-600 text-white hover:bg-indigo-700;
        }
        .calendar-day.in-range {
            @apply bg-indigo-100 text-indigo-900;
        }
        .calendar-day.disabled {
            @apply text-gray-300 cursor-not-allowed hover:bg-transparent;
        }
        .calendar-day.today {
            @apply border-2 border-indigo-600;
        }
        .hs-select-option.selected {
            @apply bg-indigo-50;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-[1920px] mx-auto bg-white rounded-xl shadow-sm p-4">
        <!-- Filtros en una sola línea -->
        <div class="flex items-center gap-2 flex-wrap">
            <!-- Empresas -->
            <div class="flex-shrink-0 w-24 sm:w-32 lg:w-36">
                <div class="relative">
                    <select class="w-full px-2 py-2 border border-gray-300 rounded-lg bg-white text-xs appearance-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Empresas</option>
                        <option value="1">Empresa 01</option>
                        <option value="2">Empresa 02</option>
                        <option value="3">Empresa 03</option>
                    </select>
                    <i class="ti ti-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Centros -->
            <div class="flex-shrink-0 w-24 sm:w-32 lg:w-36">
                <div class="relative">
                    <select class="w-full px-2 py-2 border border-gray-300 rounded-lg bg-white text-xs appearance-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Centros</option>
                        <option value="1">Centro 01</option>
                        <option value="2">Centro 02</option>
                        <option value="3">Centro 03</option>
                    </select>
                    <i class="ti ti-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Departamentos -->
            <div class="flex-shrink-0 w-28 sm:w-36 lg:w-40">
                <div class="relative">
                    <select class="w-full px-2 py-2 border border-gray-300 rounded-lg bg-white text-xs appearance-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Departamentos</option>
                        <option value="1">Departamento 01</option>
                        <option value="2">Departamento 02</option>
                        <option value="3">Departamento 03</option>
                    </select>
                    <i class="ti ti-chevron-down absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Empleado -->
            <div class="flex-shrink-0 w-32 sm:w-40 lg:w-48">
                <div class="relative">
                    <button type="button" onclick="toggleEmpleadoDropdown()" class="w-full px-2 py-2 border border-gray-300 rounded-lg bg-white text-left flex items-center gap-1 hover:border-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        <i class="ti ti-user text-gray-500 text-xs"></i>
                        <span id="empleado-selected" class="flex-1 truncate text-xs text-gray-600">Empleado</span>
                        <i class="ti ti-chevron-down text-gray-500 text-xs"></i>
                    </button>

                    <div id="empleado-dropdown" class="hidden absolute top-full left-0 w-64 bg-white border border-gray-200 rounded-lg shadow-lg z-50 mt-1">
                        <div class="p-2 border-b border-gray-200">
                            <input type="text" id="empleado-search" onkeyup="filterEmpleados()" class="w-full px-2 py-1.5 border border-gray-300 rounded-md text-xs bg-gray-50" placeholder="Buscar...">
                        </div>
                        <div class="max-h-48 overflow-y-auto p-1">
                            <div class="empleado-option p-2 cursor-pointer rounded-md flex items-center gap-2 hover:bg-gray-100" onclick="selectEmpleado('Ana Rodríguez', 'Recursos Humanos')">
                                <div class="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-semibold">AR</div>
                                <div>
                                    <div class="font-medium text-xs">Ana Rodríguez</div>
                                    <div class="text-xs text-gray-500">Recursos Humanos</div>
                                </div>
                            </div>
                            <div class="empleado-option p-2 cursor-pointer rounded-md flex items-center gap-2 hover:bg-gray-100" onclick="selectEmpleado('Carlos Méndez', 'Tecnología')">
                                <div class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs font-semibold">CM</div>
                                <div>
                                    <div class="font-medium text-xs">Carlos Méndez</div>
                                    <div class="text-xs text-gray-500">Tecnología</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Fecha Desde -->
            <div class="flex-shrink-0 w-24 sm:w-28 lg:w-32">
                <div class="relative">
                    <input type="text" id="fecha_desde" readonly onclick="toggleCalendar('desde')" placeholder="Desde" class="w-full pl-7 pr-2 py-2 rounded-lg text-xs border border-gray-300 cursor-pointer focus:ring-2 focus:ring-indigo-500">
                    <i class="ti ti-calendar absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Fecha Hasta -->
            <div class="flex-shrink-0 w-24 sm:w-28 lg:w-32">
                <div class="relative">
                    <input type="text" id="fecha_hasta" readonly onclick="toggleCalendar('hasta')" placeholder="Hasta" class="w-full pl-7 pr-2 py-2 rounded-lg text-xs border border-gray-300 cursor-pointer focus:ring-2 focus:ring-indigo-500">
                    <i class="ti ti-calendar absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Botones rápidos de fecha -->
            <button type="button" onclick="setSemanaAnterior()" class="flex-shrink-0 px-2 sm:px-3 py-2 border border-gray-300 rounded-lg text-xs hover:bg-gray-50 whitespace-nowrap">
                <span class="hidden sm:inline">Semana anterior</span>
                <span class="sm:hidden">Ant.</span>
            </button>

            <button type="button" onclick="setToday()" class="flex-shrink-0 px-2 sm:px-3 py-2 border border-gray-300 rounded-lg text-xs hover:bg-gray-50 whitespace-nowrap">
                Hoy
            </button>

            <button type="button" onclick="setSemanaSiguiente()" class="flex-shrink-0 px-2 sm:px-3 py-2 border border-gray-300 rounded-lg text-xs hover:bg-gray-50 whitespace-nowrap">
                <span class="hidden sm:inline">Semana siguiente</span>
                <span class="sm:hidden">Sig.</span>
            </button>

            <!-- Divisor -->
            <div class="flex-shrink-0 w-px h-8 bg-gray-300 hidden lg:block"></div>

            <!-- Limpiar -->
            <button type="button" id="clearBtn" onclick="clearFilters()" disabled class="flex-shrink-0 px-2 sm:px-3 py-2 border border-gray-300 bg-gray-100 text-gray-500 rounded-lg text-xs cursor-not-allowed flex items-center gap-1">
                <i class="ti ti-broom"></i>
                <span class="hidden sm:inline">Limpiar</span>
            </button>

            <!-- Buscar -->
            <button type="button" onclick="search()" class="flex-shrink-0 px-2 sm:px-3 py-2 bg-indigo-700 text-white rounded-lg text-xs hover:bg-indigo-800 flex items-center gap-1 whitespace-nowrap">
                <i class="ti ti-search"></i>
                <span class="hidden sm:inline">Buscar</span>
            </button>
        </div>

        <!-- Calendario desplegable -->
        <div id="calendar-container" class="hidden mt-4 p-4 bg-white border border-gray-200 rounded-lg shadow-lg max-w-sm mx-auto">
            <div class="flex justify-between items-center mb-4">
                <button type="button" onclick="prevCalendarMonth()" class="p-2 rounded-lg hover:bg-gray-100">
                    <i class="ti ti-chevron-left text-lg"></i>
                </button>
                <h3 id="current-month-year" class="text-sm font-semibold"></h3>
                <button type="button" onclick="nextCalendarMonth()" class="p-2 rounded-lg hover:bg-gray-100">
                    <i class="ti ti-chevron-right text-lg"></i>
                </button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-500 mb-2">
                <div>Do</div><div>Lu</div><div>Ma</div><div>Mi</div><div>Ju</div><div>Vi</div><div>Sá</div>
            </div>
            <div id="calendar-days" class="grid grid-cols-7 gap-1"></div>
        </div>


    </div>

    <script>
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedField = null;
        let dateFrom = null;
        let dateTo = null;

        // Toggle empleado dropdown
        function toggleEmpleadoDropdown() {
            const dropdown = document.getElementById('empleado-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function selectEmpleado(name, dept) {
            document.getElementById('empleado-selected').textContent = name;
            toggleEmpleadoDropdown();
            enableClearButton();
        }

        function filterEmpleados() {
            const input = document.getElementById('empleado-search').value.toLowerCase();
            const options = document.querySelectorAll('.empleado-option');
            options.forEach(option => {
                const text = option.textContent.toLowerCase();
                option.style.display = text.includes(input) ? '' : 'none';
            });
        }

        // Calendar functions
        function toggleCalendar(field) {
            selectedField = field;
            const container = document.getElementById('calendar-container');
            container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) {
                renderCalendar();
            }
        }

        function renderCalendar() {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('current-month-year').textContent = `${monthNames[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();

            let html = '';
            
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day disabled"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(currentYear, currentMonth, day);
                let classes = 'calendar-day';
                
                if (date.toDateString() === today.toDateString()) {
                    classes += ' today';
                }
                
                html += `<div class="${classes}" onclick="selectDate(${day})">${day}</div>`;
            }

            document.getElementById('calendar-days').innerHTML = html;
        }

        function selectDate(day) {
            const date = new Date(currentYear, currentMonth, day);
            const formatted = `${day.toString().padStart(2, '0')}/${(currentMonth + 1).toString().padStart(2, '0')}/${currentYear}`;
            
            if (selectedField === 'desde') {
                dateFrom = date;
                document.getElementById('fecha_desde').value = formatted;
            } else {
                dateTo = date;
                document.getElementById('fecha_hasta').value = formatted;
            }
            
            document.getElementById('calendar-container').classList.add('hidden');
            enableClearButton();
        }

        function prevCalendarMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextCalendarMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        function setSemanaAnterior() {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const lastMonday = new Date(today);
            lastMonday.setDate(today.getDate() - dayOfWeek - 6);
            const lastSunday = new Date(lastMonday);
            lastSunday.setDate(lastMonday.getDate() + 6);
            
            document.getElementById('fecha_desde').value = formatDate(lastMonday);
            document.getElementById('fecha_hasta').value = formatDate(lastSunday);
            dateFrom = lastMonday;
            dateTo = lastSunday;
            enableClearButton();
        }

        function setSemanaSiguiente() {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const nextMonday = new Date(today);
            nextMonday.setDate(today.getDate() - dayOfWeek + (dayOfWeek === 0 ? 1 : 8));
            const nextSunday = new Date(nextMonday);
            nextSunday.setDate(nextMonday.getDate() + 6);
            
            document.getElementById('fecha_desde').value = formatDate(nextMonday);
            document.getElementById('fecha_hasta').value = formatDate(nextSunday);
            dateFrom = nextMonday;
            dateTo = nextSunday;
            enableClearButton();
        }

        function setToday() {
            const today = new Date();
            const formatted = formatDate(today);
            document.getElementById('fecha_desde').value = formatted;
            document.getElementById('fecha_hasta').value = formatted;
            dateFrom = dateTo = today;
            enableClearButton();
        }

        function formatDate(date) {
            const d = date.getDate();
            const m = date.getMonth() + 1;
            const y = date.getFullYear();
            return `${d.toString().padStart(2, '0')}/${m.toString().padStart(2, '0')}/${y}`;
        }

        function enableClearButton() {
            const btn = document.getElementById('clearBtn');
            btn.disabled = false;
            btn.classList.remove('bg-gray-100', 'text-gray-500', 'cursor-not-allowed');
            btn.classList.add('bg-white', 'text-gray-700', 'hover:bg-gray-50', 'cursor-pointer');
        }

        function clearFilters() {
            document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            document.getElementById('empleado-selected').textContent = 'Empleado';
            document.getElementById('fecha_desde').value = '';
            document.getElementById('fecha_hasta').value = '';
            dateFrom = dateTo = null;
            
            const btn = document.getElementById('clearBtn');
            btn.disabled = true;
            btn.classList.add('bg-gray-100', 'text-gray-500', 'cursor-not-allowed');
            btn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-50', 'cursor-pointer');
        }

        function search() {
            alert('Buscando con filtros aplicados...');
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#empleado-dropdown') && !e.target.closest('button')) {
                document.getElementById('empleado-dropdown').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
