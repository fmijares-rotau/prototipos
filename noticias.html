<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentos · Grid con Tabler Icons</title>
    <!-- Tailwind + Tabler Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css" />
    <style>
        .ti {
            font-size: 1.5rem;
            line-height: 1;
        }
        body {
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="px-6 pb-16 max-w-6xl mx-auto">

        <!-- Header -->
        <div class="mb-10">
            <h1 class="text-[32px] font-normal text-[#101828]">Documentos</h1>
            <p class="mt-2 max-w-[600px] text-base text-[#475467]">
                Accede y gestiona toda tu documentación laboral, certificados y expedientes personales de forma segura.
            </p>
        </div>

        <!-- Grid de tarjetas con los ítems del breadcrumb -->
        <div class="grid grid-cols-2 gap-6">

            <!-- Noticias → icono periódico -->
            <a href="#" class="flex items-center gap-5 rounded-xl border border-[#EAECF0] bg-white p-6 shadow-[0_4px_10px_rgba(16,24,40,0.03)] group hover:shadow-md transition">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-sky-500/[0.08] text-sky-500">
                    <i class="ti ti-news text-2xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-bold text-[#101828]">Noticias</p>
                    <p class="text-sm text-[#475467]">Ver documentos</p>
                </div>
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-[#F5F7F8] text-[#475467] group-hover:bg-sky-50 group-hover:text-sky-600 transition">
                    <i class="ti ti-chevron-right text-sm"></i>
                </div>
            </a>

            <!-- Ofertas → icono bolsa de compras -->
            <a href="#" class="flex items-center gap-5 rounded-xl border border-[#EAECF0] bg-white p-6 shadow-[0_4px_10px_rgba(16,24,40,0.03)] group hover:shadow-md transition">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-emerald-500/[0.08] text-emerald-500">
                    <i class="ti ti-shopping-bag text-2xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-bold text-[#101828]">Ofertas</p>
                    <p class="text-sm text-[#475467]">Ver documentos</p>
                </div>
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-[#F5F7F8] text-[#475467] group-hover:bg-emerald-50 group-hover:text-emerald-600 transition">
                    <i class="ti ti-chevron-right text-sm"></i>
                </div>
            </a>

            <!-- Cumplimiento corporativo → icono certificado/diploma -->
            <a href="#" class="flex items-center gap-5 rounded-xl border border-[#EAECF0] bg-white p-6 shadow-[0_4px_10px_rgba(16,24,40,0.03)] group hover:shadow-md transition">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-indigo-500/[0.08] text-indigo-500">
                    <i class="ti ti-certificate text-2xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-bold text-[#101828]">Cumplimiento corporativo</p>
                    <p class="text-sm text-[#475467]">Ver documentos</p>
                </div>
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-[#F5F7F8] text-[#475467] group-hover:bg-indigo-50 group-hover:text-indigo-600 transition">
                    <i class="ti ti-chevron-right text-sm"></i>
                </div>
            </a>

            <!-- Documento guía → icono documento con check -->
            <a href="#" class="flex items-center gap-5 rounded-xl border border-[#EAECF0] bg-white p-6 shadow-[0_4px_10px_rgba(16,24,40,0.03)] group hover:shadow-md transition">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-amber-500/[0.08] text-amber-500">
                    <i class="ti ti-file-check text-2xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-bold text-[#101828]">Documento guía</p>
                    <p class="text-sm text-[#475467]">Ver documentos</p>
                </div>
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-[#F5F7F8] text-[#475467] group-hover:bg-amber-50 group-hover:text-amber-600 transition">
                    <i class="ti ti-chevron-right text-sm"></i>
                </div>
            </a>

            <!-- Directorio → icono libreta de contactos -->
            <a href="#" class="flex items-center gap-5 rounded-xl border border-[#EAECF0] bg-white p-6 shadow-[0_4px_10px_rgba(16,24,40,0.03)] group hover:shadow-md transition">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-violet-500/[0.08] text-violet-500">
                    <i class="ti ti-address-book text-2xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-bold text-[#101828]">Directorio</p>
                    <p class="text-sm text-[#475467]">Ver documentos</p>
                </div>
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-[#F5F7F8] text-[#475467] group-hover:bg-violet-50 group-hover:text-violet-600 transition">
                    <i class="ti ti-chevron-right text-sm"></i>
                </div>
            </a>

            <!-- Directorio → icono cuadrícula/módulos -->
            <a href="#" class="flex items-center gap-5 rounded-xl border border-[#EAECF0] bg-white p-6 shadow-[0_4px_10px_rgba(16,24,40,0.03)] group hover:shadow-md transition">
                <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-rose-500/[0.08] text-rose-500">
                    <i class="ti ti-layout-grid text-2xl"></i>
                </div>
                <div class="flex-1">
                    <p class="text-lg font-bold text-[#101828]">Directorio</p>
                    <p class="text-sm text-[#475467]">Ver documentos</p>
                </div>
                <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-2xl bg-[#F5F7F8] text-[#475467] group-hover:bg-rose-50 group-hover:text-rose-600 transition">
                    <i class="ti ti-chevron-right text-sm"></i>
                </div>
            </a>

        </div>
        <!-- fin grid -->

    </div>
    <!-- fin contenedor -->

</body>
</html>
