<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timepicker 24h Light</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <div class="relative w-full max-w-xs" id="tp-container">
    <label for="time-input" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">
      Hora (HH:MM:SS) - 24 Horas
    </label>

    <!-- Input de Texto -->
    <div class="relative flex items-center">
      <input
        type="text"
        id="time-input"
        value="14:30:00"
        maxlength="8"
        placeholder="HH:MM:SS"
        autocomplete="off"
        class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-xl font-mono tracking-widest text-[#412DB6] font-bold cursor-pointer hover:border-[#412DB6] focus:outline-none focus:border-[#412DB6] transition-colors shadow-sm"
      >
      <svg class="w-5 h-5 text-gray-400 absolute right-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <!-- Dropdown Modal -->
    <div id="tp-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 p-4 bg-white border border-gray-200 rounded-2xl shadow-xl z-50">

      <!-- Indicadores -->
      <div class="flex justify-between text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">
        <span class="flex-1">Horas</span>
        <span class="w-3"></span>
        <span class="flex-1">Minutos</span>
        <span class="w-3"></span>
        <span class="flex-1">Segundos</span>
      </div>

      <!-- Listas de selección -->
      <div class="flex justify-between items-center gap-1 h-40 my-2 relative">
        <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 h-10 bg-[#412DB6]/5 border-y border-[#412DB6]/20 rounded-lg pointer-events-none"></div>

        <!-- Columna Horas -->
        <div class="flex-1 h-full overflow-y-auto snap-y snap-mandatory no-scrollbar py-16" id="col-hours"></div>
        <span class="text-xl font-bold text-gray-300 z-10">:</span>

        <!-- Columna Minutos -->
        <div class="flex-1 h-full overflow-y-auto snap-y snap-mandatory no-scrollbar py-16" id="col-minutes"></div>
        <span class="text-xl font-bold text-gray-300 z-10">:</span>

        <!-- Columna Segundos -->
        <div class="flex-1 h-full overflow-y-auto snap-y snap-mandatory no-scrollbar py-16" id="col-seconds"></div>
      </div>

      <!-- Acciones -->
      <div class="flex items-center justify-between pt-3 border-t border-gray-200 mt-2">
        <button id="btn-now" type="button" class="text-xs font-semibold text-[#412DB6] hover:text-[#342499]">
          Ahora
        </button>
        <button id="btn-accept" type="button" class="px-4 py-1.5 bg-[#412DB6] hover:bg-[#342499] text-white text-xs font-bold rounded-lg transition-colors shadow-sm">
          Aceptar
        </button>
      </div>

    </div>
  </div>

  <script>
    let selectedTime = { hours: 14, minutes: 30, seconds: 0 };

    const input = document.getElementById('time-input');
    const dropdown = document.getElementById('tp-dropdown');
    const container = document.getElementById('tp-container');
    const colHours = document.getElementById('col-hours');
    const colMinutes = document.getElementById('col-minutes');
    const colSeconds = document.getElementById('col-seconds');

    const pad = (num) => String(num).padStart(2, '0');

    function syncFromInput() {
      const parts = input.value.split(':');
      if (parts.length === 3) {
        const h = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const s = parseInt(parts[2], 10);

        if (!isNaN(h) && h >= 0 && h < 24) selectedTime.hours = h;
        if (!isNaN(m) && m >= 0 && m < 60) selectedTime.minutes = m;
        if (!isNaN(s) && s >= 0 && s < 60) selectedTime.seconds = s;
      }
    }

    function updateInput() {
      input.value = `${pad(selectedTime.hours)}:${pad(selectedTime.minutes)}:${pad(selectedTime.seconds)}`;
    }

    function populateColumn(colContainer, max, type) {
      colContainer.innerHTML = '';
      for (let i = 0; i < max; i++) {
        const item = document.createElement('div');
        item.className = `h-10 flex items-center justify-center font-mono text-lg cursor-pointer snap-center rounded-md transition-colors text-gray-400 hover:text-[#412DB6]`;
        item.textContent = pad(i);

        item.addEventListener('click', () => {
          selectedTime[type] = i;
          scrollToValue(colContainer, i);
          updateActiveStyles(colContainer, i);
          updateInput();
        });

        colContainer.appendChild(item);
      }
    }

    function scrollToValue(colContainer, value) {
      const target = colContainer.children[value];
      if (target) {
        colContainer.scrollTo({
          top: target.offsetTop - colContainer.offsetTop - 48,
          behavior: 'smooth'
        });
      }
    }

    function updateActiveStyles(colContainer, activeValue) {
      Array.from(colContainer.children).forEach((child, idx) => {
        if (idx === activeValue) {
          child.className = 'h-10 flex items-center justify-center font-mono text-xl font-bold text-[#412DB6] snap-center rounded-md';
        } else {
          child.className = 'h-10 flex items-center justify-center font-mono text-lg text-gray-400 hover:text-[#412DB6] snap-center rounded-md';
        }
      });
    }

    function refreshDropdownUI() {
      scrollToValue(colHours, selectedTime.hours);
      scrollToValue(colMinutes, selectedTime.minutes);
      scrollToValue(colSeconds, selectedTime.seconds);

      updateActiveStyles(colHours, selectedTime.hours);
      updateActiveStyles(colMinutes, selectedTime.minutes);
      updateActiveStyles(colSeconds, selectedTime.seconds);
    }

    function setNow() {
      const now = new Date();
      selectedTime = {
        hours: now.getHours(),
        minutes: now.getMinutes(),
        seconds: now.getSeconds()
      };
      updateInput();
      refreshDropdownUI();
    }

    populateColumn(colHours, 24, 'hours');
    populateColumn(colMinutes, 60, 'minutes');
    populateColumn(colSeconds, 60, 'seconds');

    input.addEventListener('click', () => {
      syncFromInput();
      dropdown.classList.remove('hidden');
      refreshDropdownUI();
    });

    input.addEventListener('blur', () => {
      syncFromInput();
      updateInput();
    });

    document.getElementById('btn-now').addEventListener('click', setNow);
    document.getElementById('btn-accept').addEventListener('click', () => {
      dropdown.classList.add('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!container.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });

    syncFromInput();
    updateInput();
  </script>
</body>
</html>
