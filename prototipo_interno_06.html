    <title>Control de Horarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hour-cell {

            position: relative;

        .time-range {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            box-sizing: border-box;
        }
            
    </style>
</head>
